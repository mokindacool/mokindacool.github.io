<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none';">
  <title>Dashboard — Mohamed Ganda</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    nav {
      padding: 1.5rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 2.5rem;
    }

    .logo { font-size: 1.2rem; font-weight: 600; }
    .logo span { color: #00bfa5; }

    .logout-btn {
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      background: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .logout-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }

    .section-title {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #00bfa5;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 1.5rem;
    }

    /* Summary */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .summary-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
    }

    .summary-card .label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.4rem;
    }

    .summary-card .value {
      font-size: 2rem;
      font-weight: 700;
    }

    .value.income   { color: #00bfa5; }
    .value.expenses { color: #ff6b6b; }
    .value.invested { color: #a29bfe; }
    .value.savings  { color: #74b9ff; }

    /* Main grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* Inputs */
    input[type="text"],
    input[type="number"],
    input[type="date"],
    select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="date"]:focus,
    select:focus { border-color: #00bfa5; }

    select option { background: #1e3a4a; color: #fff; }

    input[type="date"] { color-scheme: dark; }

    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      align-items: center;
    }

    .input-row input[type="number"] { width: 110px; flex-shrink: 0; }
    .input-row input[type="date"]   { width: 145px; flex-shrink: 0; }
    .input-row select               { width: 140px; flex-shrink: 0; }

    .btn-add {
      background: #00bfa5;
      color: #0f2027;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-add:hover { background: #00a896; }

    .btn-set {
      background: rgba(255,255,255,0.1);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-set:hover { background: rgba(255,255,255,0.18); }

    .btn-remove {
      background: none;
      border: none;
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .btn-remove:hover { color: #ff6b6b; }

    .btn-sm {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-sm:hover { background: rgba(255,255,255,0.2); }

    .empty-state {
      color: rgba(255,255,255,0.3);
      font-size: 0.88rem;
      text-align: center;
      padding: 0.75rem 0;
    }

    /* Progress bars */
    .prog-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.55);
      margin-bottom: 0.35rem;
    }

    .prog-bg {
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .prog-fill {
      background: linear-gradient(90deg, #00bfa5, #74b9ff);
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .prog-fill.warn { background: linear-gradient(90deg, #f39c12, #ff6b6b); }

    /* Paycheck list */
    .list-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .list-item:last-child { border-bottom: none; }

    .list-item .item-label { flex: 1; font-size: 0.92rem; }
    .list-item .item-date  { font-size: 0.78rem; color: rgba(255,255,255,0.4); }
    .list-item .item-amount-green { font-weight: 600; color: #00bfa5; font-size: 0.92rem; }
    .list-item .item-amount-red   { font-weight: 600; color: #ff6b6b; font-size: 0.92rem; }

    /* Category badge */
    .cat-badge {
      font-size: 0.7rem;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-weight: 500;
      flex-shrink: 0;
    }
    .cat-rent          { background: rgba(116,185,255,0.2); color: #74b9ff; }
    .cat-utilities     { background: rgba(253,203,110,0.2); color: #fdcb6e; }
    .cat-food          { background: rgba(0,191,165,0.2);   color: #00bfa5; }
    .cat-fun           { background: rgba(162,155,254,0.2); color: #a29bfe; }
    .cat-subscriptions { background: rgba(255,107,107,0.2); color: #ff6b6b; }
    .cat-other         { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }

    /* Category group header */
    .cat-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      margin-top: 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      cursor: pointer;
      user-select: none;
    }
    .cat-group-header .cat-group-name {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .cat-group-header .cat-group-total {
      font-size: 0.85rem;
      color: #ff6b6b;
      font-weight: 600;
    }
    .cat-group-header .chevron {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      margin-left: 0.5rem;
      transition: transform 0.2s;
    }
    .cat-group-header.collapsed .chevron { transform: rotate(-90deg); }

    /* Goals */
    .goal-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .goal-item:last-child { border-bottom: none; }

    .goal-item input[type="checkbox"] {
      width: 17px; height: 17px;
      accent-color: #00bfa5;
      flex-shrink: 0;
      margin-top: 3px;
      cursor: pointer;
    }

    .goal-body { flex: 1; }
    .goal-text { font-size: 0.93rem; }
    .goal-text.done { text-decoration: line-through; opacity: 0.4; }
    .goal-due  { font-size: 0.76rem; color: rgba(255,255,255,0.4); }

    .goal-progress-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.35rem;
    }

    .goal-prog-bg {
      flex: 1;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
    }

    .goal-prog-fill {
      background: linear-gradient(90deg, #00bfa5, #74b9ff);
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s;
    }

    .goal-prog-label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      white-space: nowrap;
    }

    .goal-log-wrap {
      display: none;
      margin-top: 0.4rem;
    }

    .goal-log-wrap.open { display: flex; gap: 0.4rem; }
    .goal-log-wrap input { font-size: 0.82rem; padding: 0.3rem 0.6rem; }

    /* Investment accounts */
    .invest-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .invest-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
    }

    .invest-card h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .invest-balance {
      font-size: 1.7rem;
      font-weight: 700;
      color: #74b9ff;
      margin-bottom: 0.75rem;
    }

    .invest-balance.warn { color: #ff6b6b; }

    .invest-history {
      max-height: 120px;
      overflow-y: auto;
      margin-top: 0.75rem;
    }

    .invest-history::-webkit-scrollbar { width: 4px; }
    .invest-history::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    @media (max-width: 750px) {
      .summary-row    { grid-template-columns: 1fr; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .invest-grid    { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">
  <nav>
    <div class="logo">Mohamed Ganda <span>/ Dashboard</span></div>
    <button class="logout-btn" id="logout-btn">Logout</button>
  </nav>

  <!-- Summary -->
  <div class="summary-row">
    <div class="summary-card">
      <div class="label">This Month's Income</div>
      <div class="value income" id="display-income">$0</div>
    </div>
    <div class="summary-card">
      <div class="label">Expenses</div>
      <div class="value expenses" id="display-expenses">$0</div>
    </div>
    <div class="summary-card">
      <div class="label">Invested This Month</div>
      <div class="value invested" id="display-invested">$0</div>
    </div>
    <div class="summary-card">
      <div class="label">Cash Remaining</div>
      <div class="value savings" id="display-savings">$0</div>
    </div>
  </div>

  <div id="period-label" style="font-size:0.8rem; color:rgba(255,255,255,0.4); margin:-1rem 0 1.75rem; letter-spacing:0.05em;"></div>

  <!-- Main 2-col grid -->
  <div class="dashboard-grid">

    <!-- Left: Finance -->
    <div>
      <div class="section-title">Finance Tracker</div>
      <div class="card">

        <!-- Paychecks -->
        <div class="section-title" style="margin-bottom: 0.6rem;">Paychecks</div>
        <div class="input-row">
          <input type="text" id="pay-label" placeholder="e.g. July 1 paycheck" />
          <input type="number" id="pay-amount" placeholder="$" min="0" />
          <input type="date" id="pay-date" />
          <button class="btn-add" id="add-pay-btn">Add</button>
        </div>
        <div id="paycheck-list" style="margin-bottom: 1.25rem;"></div>

        <!-- Savings Goal -->
        <div class="section-title" style="margin-bottom: 0.6rem;">Savings Goal</div>
        <div class="input-row" style="margin-bottom: 0.5rem;">
          <label style="font-size:0.85rem; color:rgba(255,255,255,0.6); white-space:nowrap;">Monthly target ($)</label>
          <input type="number" id="savings-goal-input" placeholder="e.g. 1000" min="0" style="width:130px; flex-shrink:0;" />
          <button class="btn-set" id="savings-goal-set-btn">Set</button>
        </div>
        <div class="prog-row">
          <span>Savings Progress</span>
          <span id="savings-progress-text">$0 / $0</span>
        </div>
        <div class="prog-bg">
          <div class="prog-fill" id="savings-progress-fill" style="width:0%"></div>
        </div>

        <!-- Expenses -->
        <div class="section-title" style="margin-bottom: 0.6rem;">Expenses</div>
        <div class="input-row">
          <input type="text" id="expense-name" placeholder="Expense name" />
          <input type="number" id="expense-amount" placeholder="$" min="0" />
          <select id="expense-category">
            <option value="rent">Rent</option>
            <option value="utilities">Utilities</option>
            <option value="food">Food</option>
            <option value="fun">Fun</option>
            <option value="subscriptions">Subscriptions</option>
            <option value="other">Other</option>
          </select>
          <button class="btn-add" id="add-expense-btn">Add</button>
        </div>
        <div id="expense-list"></div>
      </div>
    </div>

    <!-- Right: Goals -->
    <div>
      <div class="section-title">Goals</div>
      <div class="card">
        <div class="input-row">
          <input type="text" id="goal-text" placeholder="New goal..." />
          <input type="number" id="goal-target" placeholder="Target $" min="0" style="width:115px; flex-shrink:0;" />
          <input type="date" id="goal-date" style="width:145px; flex-shrink:0;" />
          <button class="btn-add" id="add-goal-btn">Add</button>
        </div>
        <div id="goal-list"></div>
      </div>
    </div>
  </div>

  <!-- Investment Accounts -->
  <div class="section-title">Investment Accounts</div>
  <div class="invest-grid">

    <!-- Roth IRA -->
    <div class="invest-card">
      <h3>Roth IRA</h3>
      <div class="invest-balance" id="roth-balance">$0</div>
      <div class="prog-row">
        <span>Yearly Contributions</span>
        <span id="roth-progress-text">$0 / $7,500</span>
      </div>
      <div class="prog-bg">
        <div class="prog-fill" id="roth-progress-fill" style="width:0%"></div>
      </div>
      <div class="input-row" style="margin-top: 0.5rem;">
        <input type="number" id="roth-amount" placeholder="Amount $" min="0" />
        <input type="text" id="roth-note" placeholder="Note" />
        <button class="btn-add" id="roth-add-btn">Add</button>
      </div>
      <div class="invest-history" id="roth-history"></div>
    </div>

    <!-- HYSA -->
    <div class="invest-card">
      <h3>HYSA</h3>
      <div class="invest-balance" id="hysa-balance">$0</div>
      <div class="input-row">
        <input type="number" id="hysa-amount" placeholder="Amount $" min="0" />
        <input type="text" id="hysa-note" placeholder="Note" />
        <button class="btn-add" id="hysa-add-btn">Add</button>
      </div>
      <div class="invest-history" id="hysa-history"></div>
    </div>

    <!-- Brokerage -->
    <div class="invest-card">
      <h3>Brokerage</h3>
      <div class="invest-balance" id="brokerage-balance">$0</div>
      <div class="input-row">
        <input type="number" id="brokerage-amount" placeholder="Amount $" min="0" />
        <input type="text" id="brokerage-note" placeholder="Note" />
        <button class="btn-add" id="brokerage-add-btn">Add</button>
      </div>
      <div class="invest-history" id="brokerage-history"></div>
    </div>

  </div>

  <!-- Monthly Reports -->
  <div style="margin-top: 2.5rem;">
    <div class="section-title">Monthly Reports</div>
    <div id="monthly-reports-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem;"></div>
  </div>
</div>

<script>
  // Auth guard
  if (!sessionStorage.getItem('authed')) window.location.href = 'index.html';

  document.getElementById('logout-btn').addEventListener('click', () => {
    sessionStorage.removeItem('authed');
    window.location.href = 'index.html';
  });

  // ── Storage helpers ──
  const load = (key, fb) => { try { return JSON.parse(localStorage.getItem(key)) ?? fb; } catch { return fb; } };
  const save = (key, val) => localStorage.setItem(key, JSON.stringify(val));

  // ── State ──
  let paychecks  = load('dashboard_paychecks', []);
  let expenses   = load('dashboard_expenses', []);
  let savingsGoal = load('dashboard_savings_goal', 0);
  let goals      = load('dashboard_goals', []);
  let rothContribs     = load('dashboard_roth_contributions', []);
  let hysaContribs     = load('dashboard_hysa_contributions', []);
  let brokerageContribs = load('dashboard_brokerage_contributions', []);

  const ROTH_LIMIT = 7500;

  // ── Helpers ──
  function fmt(n) {
    return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }
  function thisYear() { return new Date().getFullYear(); }

  // ── Period helpers (cycle resets on the 20th) ──
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function periodStart(d) {
    // The most recent 20th on or before d
    return d.getDate() >= 20
      ? new Date(d.getFullYear(), d.getMonth(), 20)
      : new Date(d.getFullYear(), d.getMonth() - 1, 20);
  }

  function periodEnd(start) {
    // 19th of the month after start
    return new Date(start.getFullYear(), start.getMonth() + 1, 19);
  }

  function periodLabel(start) {
    const end = periodEnd(start);
    return `${MONTHS[start.getMonth()]} ${start.getDate()} – ${MONTHS[end.getMonth()]} ${end.getDate()}, ${end.getFullYear()}`;
  }

  function inPeriod(dateStr, start, end) {
    if (!dateStr) return false;
    const d = new Date(dateStr + 'T00:00:00');
    return d >= start && d <= end;
  }

  function currentPeriodStart() { return periodStart(new Date()); }
  function currentPeriodEnd()   { return periodEnd(currentPeriodStart()); }

  // Past N periods (index 0 = current)
  function getPeriods(n) {
    const periods = [];
    let start = currentPeriodStart();
    for (let i = 0; i < n; i++) {
      const end = periodEnd(start);
      periods.push({ start, end, label: periodLabel(start) });
      start = new Date(start.getFullYear(), start.getMonth() - 1, 20);
    }
    return periods;
  }

  // ── Summary (current period) ──
  function monthlyIncome() {
    const s = currentPeriodStart(), e = currentPeriodEnd();
    return paychecks.filter(p => inPeriod(p.date, s, e)).reduce((t, p) => t + Number(p.amount), 0);
  }
  function totalExpenses() {
    const s = currentPeriodStart(), e = currentPeriodEnd();
    return expenses.filter(x => inPeriod(x.date, s, e)).reduce((t, x) => t + Number(x.amount), 0);
  }
  function monthlyInvested() {
    const s = currentPeriodStart(), e = currentPeriodEnd();
    const sum = arr => arr.filter(c => inPeriod(c.date, s, e)).reduce((t, c) => t + Number(c.amount), 0);
    return sum(rothContribs) + sum(hysaContribs) + sum(brokerageContribs);
  }
  function netSavings() { return monthlyIncome() - totalExpenses() - monthlyInvested(); }

  function renderSummary() {
    document.getElementById('display-income').textContent   = fmt(monthlyIncome());
    document.getElementById('display-expenses').textContent = fmt(totalExpenses());
    document.getElementById('display-invested').textContent = fmt(monthlyInvested());
    const ns = netSavings();
    const el = document.getElementById('display-savings');
    el.textContent  = fmt(ns);
    el.style.color  = ns >= 0 ? '#74b9ff' : '#ff6b6b';

    const pct = savingsGoal > 0 ? Math.min(100, Math.max(0, (ns / savingsGoal) * 100)) : 0;
    document.getElementById('savings-progress-fill').style.width = pct + '%';
    document.getElementById('savings-progress-text').textContent = fmt(ns) + ' / ' + fmt(savingsGoal);
  }

  // ── Paychecks ──
  function renderPaychecks() {
    const el = document.getElementById('paycheck-list');
    if (!paychecks.length) { el.innerHTML = '<div class="empty-state">No paychecks logged yet.</div>'; return; }
    el.innerHTML = [...paychecks].reverse().map(p => `
      <div class="list-item">
        <span class="item-label">${escHtml(p.label || 'Paycheck')}</span>
        <span class="item-date">${p.date || ''}</span>
        <span class="item-amount-green">${fmt(p.amount)}</span>
        <button class="btn-remove" data-id="${p.id}" title="Remove">×</button>
      </div>
    `).join('');
    el.querySelectorAll('.btn-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        paychecks = paychecks.filter(p => p.id !== btn.dataset.id);
        save('dashboard_paychecks', paychecks);
        renderPaychecks(); renderSummary(); renderMonthlyReports();
      });
    });
  }

  const payDate = document.getElementById('pay-date');
  payDate.value = todayStr();

  document.getElementById('add-pay-btn').addEventListener('click', () => {
    const label  = document.getElementById('pay-label').value.trim() || 'Paycheck';
    const amount = Number(document.getElementById('pay-amount').value);
    if (!amount) return;
    const date = payDate.value || todayStr();
    paychecks.push({ id: Date.now().toString(), label, amount, date });
    save('dashboard_paychecks', paychecks);
    document.getElementById('pay-label').value  = '';
    document.getElementById('pay-amount').value = '';
    payDate.value = todayStr();
    renderPaychecks(); renderSummary(); renderMonthlyReports();
  });

  ['pay-label','pay-amount'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('add-pay-btn').click(); })
  );

  // ── Savings goal ──
  document.getElementById('savings-goal-input').value = savingsGoal || '';
  document.getElementById('savings-goal-set-btn').addEventListener('click', () => {
    savingsGoal = Number(document.getElementById('savings-goal-input').value) || 0;
    save('dashboard_savings_goal', savingsGoal);
    renderSummary();
  });

  // ── Expenses ──
  const CATEGORIES = ['rent','utilities','food','fun','subscriptions','other'];
  const CAT_LABELS = { rent:'Rent', utilities:'Utilities', food:'Food', fun:'Fun', subscriptions:'Subscriptions', other:'Other' };

  function renderExpenses() {
    const el = document.getElementById('expense-list');
    const s = currentPeriodStart(), e = currentPeriodEnd();
    const periodItems = expenses.filter(x => inPeriod(x.date, s, e));
    if (!periodItems.length) { el.innerHTML = '<div class="empty-state">No expenses this period.</div>'; return; }

    const grouped = {};
    CATEGORIES.forEach(c => { grouped[c] = []; });
    periodItems.forEach(e => { (grouped[e.category] || (grouped['other'] = grouped['other'] || [])).push(e); });

    let html = '';
    CATEGORIES.forEach(cat => {
      const items = grouped[cat];
      if (!items || !items.length) return;
      const subtotal = items.reduce((s, e) => s + Number(e.amount), 0);
      html += `
        <div class="cat-group-header" data-cat="${cat}">
          <span class="cat-group-name"><span class="cat-badge cat-${cat}">${CAT_LABELS[cat]}</span></span>
          <span style="display:flex;align-items:center;gap:0.4rem;">
            <span class="cat-group-total">${fmt(subtotal)}</span>
            <span class="chevron">▼</span>
          </span>
        </div>
        <div class="cat-group-body" data-cat="${cat}">
          ${items.map(e => `
            <div class="list-item" style="padding-left:0.5rem;">
              <span class="item-label">${escHtml(e.name)}</span>
              <span class="item-amount-red">${fmt(e.amount)}</span>
              <button class="btn-remove" data-id="${e.id}" title="Remove">×</button>
            </div>
          `).join('')}
        </div>
      `;
    });
    el.innerHTML = html;

    el.querySelectorAll('.cat-group-header').forEach(h => {
      h.addEventListener('click', () => {
        const body = el.querySelector(`.cat-group-body[data-cat="${h.dataset.cat}"]`);
        if (body.style.display === 'none') { body.style.display = ''; h.classList.remove('collapsed'); }
        else { body.style.display = 'none'; h.classList.add('collapsed'); }
      });
    });

    el.querySelectorAll('.btn-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        expenses = expenses.filter(e => e.id !== btn.dataset.id);
        save('dashboard_expenses', expenses);
        renderExpenses(); renderSummary(); renderMonthlyReports();
      });
    });
  }

  document.getElementById('add-expense-btn').addEventListener('click', () => {
    const name     = document.getElementById('expense-name').value.trim();
    const amount   = Number(document.getElementById('expense-amount').value);
    const category = document.getElementById('expense-category').value;
    if (!name || !amount) return;
    expenses.push({ id: Date.now().toString(), name, amount, category, date: todayStr() });
    save('dashboard_expenses', expenses);
    document.getElementById('expense-name').value   = '';
    document.getElementById('expense-amount').value = '';
    renderExpenses(); renderSummary(); renderMonthlyReports();
  });

  ['expense-name','expense-amount'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('add-expense-btn').click(); })
  );

  // ── Goals ──
  function renderGoals() {
    const el = document.getElementById('goal-list');
    if (!goals.length) { el.innerHTML = '<div class="empty-state">No goals yet. Add one above!</div>'; return; }

    el.innerHTML = goals.map(g => {
      const hasTarget = g.target > 0;
      const pct = hasTarget ? Math.min(100, Math.max(0, ((g.current || 0) / g.target) * 100)) : 0;
      return `
        <div class="goal-item">
          <input type="checkbox" ${g.done ? 'checked' : ''} data-id="${g.id}" />
          <div class="goal-body">
            <div class="goal-text ${g.done ? 'done' : ''}">${escHtml(g.text)}</div>
            ${g.dueDate ? `<div class="goal-due">Due: ${g.dueDate}</div>` : ''}
            ${hasTarget ? `
              <div class="goal-progress-row">
                <div class="goal-prog-bg"><div class="goal-prog-fill" style="width:${pct}%"></div></div>
                <span class="goal-prog-label">${fmt(g.current||0)} / ${fmt(g.target)}</span>
                <button class="btn-sm goal-log-btn" data-id="${g.id}">+ Log</button>
              </div>
              <div class="goal-log-wrap" id="goal-log-${g.id}">
                <input type="number" placeholder="Add $" min="0" class="goal-log-input" id="goal-log-input-${g.id}" />
                <button class="btn-add goal-log-save" data-id="${g.id}" style="padding:0.3rem 0.7rem; font-size:0.82rem;">Save</button>
                <button class="btn-sm goal-log-cancel" data-id="${g.id}">×</button>
              </div>
            ` : ''}
          </div>
          <button class="btn-remove" data-id="${g.id}" title="Remove">×</button>
        </div>
      `;
    }).join('');

    // Checkbox
    el.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        const g = goals.find(g => g.id === cb.dataset.id);
        if (g) { g.done = cb.checked; save('dashboard_goals', goals); renderGoals(); }
      });
    });

    // Remove
    el.querySelectorAll('.btn-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        goals = goals.filter(g => g.id !== btn.dataset.id);
        save('dashboard_goals', goals);
        renderGoals();
      });
    });

    // Log progress toggle
    el.querySelectorAll('.goal-log-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const wrap = document.getElementById('goal-log-' + btn.dataset.id);
        wrap.classList.toggle('open');
        if (wrap.classList.contains('open')) document.getElementById('goal-log-input-' + btn.dataset.id).focus();
      });
    });

    el.querySelectorAll('.goal-log-cancel').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('goal-log-' + btn.dataset.id).classList.remove('open');
      });
    });

    el.querySelectorAll('.goal-log-save').forEach(btn => {
      btn.addEventListener('click', () => {
        const g = goals.find(g => g.id === btn.dataset.id);
        const added = Number(document.getElementById('goal-log-input-' + btn.dataset.id).value);
        if (g && added > 0) {
          g.current = (g.current || 0) + added;
          save('dashboard_goals', goals);
          renderGoals();
        }
      });
    });
  }

  document.getElementById('add-goal-btn').addEventListener('click', () => {
    const text   = document.getElementById('goal-text').value.trim();
    if (!text) return;
    const target  = Number(document.getElementById('goal-target').value) || 0;
    const dueDate = document.getElementById('goal-date').value;
    goals.push({ id: Date.now().toString(), text, dueDate, done: false, target, current: 0 });
    save('dashboard_goals', goals);
    document.getElementById('goal-text').value   = '';
    document.getElementById('goal-target').value = '';
    document.getElementById('goal-date').value   = '';
    renderGoals();
  });

  document.getElementById('goal-text').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('add-goal-btn').click();
  });

  // ── Investment accounts ──
  function investBalance(contribs) {
    return contribs.reduce((s, c) => s + Number(c.amount), 0);
  }
  function rothThisYear() {
    const y = thisYear().toString();
    return rothContribs.filter(c => c.date && c.date.startsWith(y)).reduce((s, c) => s + Number(c.amount), 0);
  }

  function renderRoth() {
    const total  = investBalance(rothContribs);
    const yearly = rothThisYear();
    const pct    = Math.min(100, (yearly / ROTH_LIMIT) * 100);
    const over   = yearly >= ROTH_LIMIT;

    document.getElementById('roth-balance').textContent = fmt(total);
    document.getElementById('roth-balance').className   = 'invest-balance' + (over ? ' warn' : '');
    document.getElementById('roth-progress-text').textContent = fmt(yearly) + ' / ' + fmt(ROTH_LIMIT);
    const fill = document.getElementById('roth-progress-fill');
    fill.style.width = pct + '%';
    fill.className   = 'prog-fill' + (over ? ' warn' : '');

    const hist = document.getElementById('roth-history');
    if (!rothContribs.length) { hist.innerHTML = '<div class="empty-state">No contributions yet.</div>'; return; }
    hist.innerHTML = [...rothContribs].reverse().map(c => `
      <div class="list-item">
        <span class="item-label">${escHtml(c.note || 'Contribution')}</span>
        <span class="item-date">${c.date || ''}</span>
        <span class="item-amount-green">${fmt(c.amount)}</span>
        <button class="btn-remove" data-id="${c.id}" title="Remove">×</button>
      </div>
    `).join('');
    hist.querySelectorAll('.btn-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        rothContribs = rothContribs.filter(c => c.id !== btn.dataset.id);
        save('dashboard_roth_contributions', rothContribs);
        renderRoth(); renderSummary(); renderMonthlyReports();
      });
    });
  }

  function renderInvest(key, contribs, balanceId, histId) {
    document.getElementById(balanceId).textContent = fmt(investBalance(contribs));
    const hist = document.getElementById(histId);
    if (!contribs.length) { hist.innerHTML = '<div class="empty-state">No contributions yet.</div>'; return; }
    hist.innerHTML = [...contribs].reverse().map(c => `
      <div class="list-item">
        <span class="item-label">${escHtml(c.note || 'Contribution')}</span>
        <span class="item-date">${c.date || ''}</span>
        <span class="item-amount-green">${fmt(c.amount)}</span>
        <button class="btn-remove" data-id="${c.id}" title="Remove">×</button>
      </div>
    `).join('');
    hist.querySelectorAll('.btn-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        if (key === 'dashboard_hysa_contributions')      hysaContribs     = hysaContribs.filter(c => c.id !== btn.dataset.id);
        if (key === 'dashboard_brokerage_contributions') brokerageContribs = brokerageContribs.filter(c => c.id !== btn.dataset.id);
        save(key, key === 'dashboard_hysa_contributions' ? hysaContribs : brokerageContribs);
        renderInvest(key, key === 'dashboard_hysa_contributions' ? hysaContribs : brokerageContribs, balanceId, histId);
        renderSummary(); renderMonthlyReports();
      });
    });
  }

  function addInvestContrib(amtId, noteId, store, saveKey, renderFn) {
    const amount = Number(document.getElementById(amtId).value);
    if (!amount) return;
    const note = document.getElementById(noteId).value.trim();
    store.push({ id: Date.now().toString(), amount, note, date: todayStr() });
    save(saveKey, store);
    document.getElementById(amtId).value  = '';
    document.getElementById(noteId).value = '';
    renderFn();
    renderSummary(); renderMonthlyReports();
  }

  document.getElementById('roth-add-btn').addEventListener('click', () => {
    addInvestContrib('roth-amount','roth-note', rothContribs, 'dashboard_roth_contributions', renderRoth);
  });
  document.getElementById('hysa-add-btn').addEventListener('click', () => {
    addInvestContrib('hysa-amount','hysa-note', hysaContribs, 'dashboard_hysa_contributions',
      () => renderInvest('dashboard_hysa_contributions', hysaContribs, 'hysa-balance', 'hysa-history'));
  });
  document.getElementById('brokerage-add-btn').addEventListener('click', () => {
    addInvestContrib('brokerage-amount','brokerage-note', brokerageContribs, 'dashboard_brokerage_contributions',
      () => renderInvest('dashboard_brokerage_contributions', brokerageContribs, 'brokerage-balance', 'brokerage-history'));
  });

  ['roth-amount','hysa-amount','brokerage-amount'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById(id.replace('-amount','-add-btn')).click();
    });
  });

  // ── Monthly Reports ──
  function reportForPeriod(start, end) {
    const income = paychecks.filter(p => inPeriod(p.date, start, end)).reduce((t, p) => t + Number(p.amount), 0);
    const periodExp = expenses.filter(x => inPeriod(x.date, start, end));
    const totalExp  = periodExp.reduce((t, x) => t + Number(x.amount), 0);
    const byCat = {};
    periodExp.forEach(x => { byCat[x.category] = (byCat[x.category] || 0) + Number(x.amount); });
    const sum = arr => arr.filter(c => inPeriod(c.date, start, end)).reduce((t, c) => t + Number(c.amount), 0);
    const invested = sum(rothContribs) + sum(hysaContribs) + sum(brokerageContribs);
    return { income, totalExp, byCat, invested, net: income - totalExp - invested };
  }

  function renderMonthlyReports() {
    const el = document.getElementById('monthly-reports-grid');
    const periods = getPeriods(6);
    el.innerHTML = periods.map((p, i) => {
      const r = reportForPeriod(p.start, p.end);
      const netColor = r.net >= 0 ? '#74b9ff' : '#ff6b6b';
      const catRows = Object.entries(r.byCat).map(([cat, amt]) =>
        `<div style="display:flex;justify-content:space-between;font-size:0.78rem;color:rgba(255,255,255,0.5);margin-top:0.2rem;">
          <span class="cat-badge cat-${cat}" style="font-size:0.68rem;">${CAT_LABELS[cat]||cat}</span>
          <span>${fmt(amt)}</span>
        </div>`
      ).join('');
      return `
        <div class="card" style="padding:1.25rem; position:relative;">
          ${i === 0 ? '<span style="position:absolute;top:0.75rem;right:0.75rem;font-size:0.65rem;background:rgba(0,191,165,0.2);color:#00bfa5;padding:0.15rem 0.5rem;border-radius:999px;font-weight:600;">CURRENT</span>' : ''}
          <div style="font-size:0.78rem;color:rgba(255,255,255,0.45);margin-bottom:0.75rem;">${p.label}</div>
          <div style="display:flex;justify-content:space-between;margin-bottom:0.25rem;">
            <span style="font-size:0.82rem;color:rgba(255,255,255,0.6);">Income</span>
            <span style="font-size:0.82rem;font-weight:600;color:#00bfa5;">${fmt(r.income)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:0.25rem;">
            <span style="font-size:0.82rem;color:rgba(255,255,255,0.6);">Expenses</span>
            <span style="font-size:0.82rem;font-weight:600;color:#ff6b6b;">${fmt(r.totalExp)}</span>
          </div>
          ${catRows}
          <div style="display:flex;justify-content:space-between;margin-top:0.25rem;margin-bottom:0.5rem;">
            <span style="font-size:0.82rem;color:rgba(255,255,255,0.6);">Invested</span>
            <span style="font-size:0.82rem;font-weight:600;color:#a29bfe;">${fmt(r.invested)}</span>
          </div>
          <div style="border-top:1px solid rgba(255,255,255,0.1);margin-top:0.5rem;padding-top:0.5rem;display:flex;justify-content:space-between;">
            <span style="font-size:0.85rem;font-weight:600;">Net</span>
            <span style="font-size:0.85rem;font-weight:700;color:${netColor};">${fmt(r.net)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  // ── Init ──
  document.getElementById('period-label').textContent = 'Current period: ' + periodLabel(currentPeriodStart());
  renderSummary();
  renderPaychecks();
  renderExpenses();
  renderGoals();
  renderRoth();
  renderInvest('dashboard_hysa_contributions', hysaContribs, 'hysa-balance', 'hysa-history');
  renderInvest('dashboard_brokerage_contributions', brokerageContribs, 'brokerage-balance', 'brokerage-history');
  renderMonthlyReports();
</script>
</body>
</html>
